    <script>
      // Clear any stale service workers and caches from previous sessions safely
      try {
        if (typeof window !== 'undefined' && window.self === window.top) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              if (regs && regs.length > 0) {
                for (var i = 0; i < regs.length; i++) {
                  regs[i].unregister();
                }
                if (!sessionStorage.getItem('sw_purged_v3')) {
                  sessionStorage.setItem('sw_purged_v3', '1');
                  window.location.reload();
                }
              }
            }).catch(function() {});
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            }).catch(function() {});
          }
        }
      } catch (e) {
        // Silently ignore iframe / sandbox security restrictions
      }
    </script>
